[tool.pytest.ini_options]
testpaths = ["tests"]

# Tests run on a desktop, inside a live GUI session. Anything that constructs a
# real Tk window would put it on screen in front of whatever the user is doing,
# so a window-opening test must be marked `gui` and is excluded from a plain
# `pytest` run. Nothing in the suite carries the marker today: the GUI tests
# cover module-level logic and duck-typed stand-ins, and build no widgets.
addopts = ["-m", "not gui"]
markers = [
    "gui: opens real windows; excluded from the default run",
]

# Coverage is measured over services/ alone, and that is deliberate. services/
# is the engine — it holds every behaviour the GUI, the CLI and MacShapearator
# share, and all of it can be tested offline. gui/ is the other kind of code:
# past the logic already extracted into services/, what remains is widget
# layout, dialogs and thread plumbing, reachable only by constructing real
# windows, which the `gui` marker above keeps out of a default run. Counting it
# would move the number without telling anyone anything about the engine.
[tool.coverage.run]
source = ["services"]
# Branch coverage, not just statements: a half-tested `if` is the shape most of
# this engine's bugs take — a preflight that passes but was never seen failing,
# a fallback path no test walks.
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
